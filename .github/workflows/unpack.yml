name: unpack

# Remplace tout le projet du dépôt par le contenu d'un zip déposé à la racine du dépôt.
# Lancer : onglet Actions > unpack > Run workflow. Le dossier .github n'est jamais modifié.
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nom exact du zip déposé à la racine du dépôt"
        default: "mots-meles-godot-1.2.1.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer le projet par le contenu du zip
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          set -e
          test -f "$ZIP" || { echo "Zip introuvable à la racine : $ZIP"; exit 1; }
          rm -rf /tmp/new && mkdir /tmp/new
          unzip -q "$ZIP" -d /tmp/new
          SRC=$(find /tmp/new -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$SRC/project.godot" || { echo "project.godot absent du zip"; exit 1; }
          rm -rf "$SRC/.github"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$ZIP" -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f "$ZIP"
      - name: Enregistrer
        run: |
          git config user.name "unpack"
          git config user.email "unpack@users.noreply.github.com"
          git add -A
          git commit -m "Projet Mots Mêlés : contenu du zip" || echo "Rien à enregistrer"
          git push
